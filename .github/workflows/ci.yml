name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  session:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/session } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.13" }
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: services/session/models
          key: opencv-zoo-models-${{ hashFiles('services/session/tools/fetch_models.py') }}
      - run: uv run python tools/fetch_models.py
      - run: uv run ruff check .
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
