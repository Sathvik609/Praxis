[project]
name = "praxis-session"
version = "0.2.0"
description = "Praxis session service: FastAPI + WebSocket frame ingest + OpenCV 5 perception + stop rules + coach (in-process)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python-headless==5.0.0.93",
    "numpy==2.3.3",
    "fastapi==0.162.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.37.0",
    "websockets==15.0.1",
    "pydantic==2.11.9",
    "reportlab==4.4.3",
    "jsonschema==4.25.1",
    "strands-agents[anthropic]==1.57.1",
    "fastmcp==3.4.10",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.13.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis_session"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # test client only: Starlette 1.x wants httpx2 for TestClient; the service itself never uses httpx
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["praxis_session/perception/zoo"]
